name: Test scripts

# Smoke-tests the install scripts on real Windows, Linux and macOS runners (Windows is an administrator; Unix has passwordless sudo).
on:
  pull_request:
    paths: ['scripts/**', 'src/**', '.github/workflows/test-scripts.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-uninstall:
    name: Install and uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use the packed .crx fixture
        shell: bash
        run: |
          # A .crx packed with the real key, kept in tests/fixtures. The scripts look for it in the repo root.
          cp tests/fixtures/gh-slash-autocomplete-*.crx .

      - name: Install
        shell: powershell
        run: ./scripts/install-gh-slash-extension.ps1 -NoPause

      - name: Check the registry entries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $id = [regex]::Match((Get-Content scripts/lib-gh-slash-extension.ps1 -Raw), '\$ExtensionID = "(\w+)"').Groups[1].Value
          $crx = (Get-ChildItem gh-slash-autocomplete-*.crx | Select-Object -First 1).FullName
          $version = [regex]::Match($crx, 'gh-slash-autocomplete-(.+).crx').Groups[1].Value
          foreach ($key in "HKLM:\SOFTWARE\Google\Chrome\Extensions\$id", "HKLM:\SOFTWARE\WOW6432Node\Google\Chrome\Extensions\$id") {
            $item = Get-ItemProperty -Path $key
            if ($item.path -ne $crx) { throw "$key path is '$($item.path)', expected '$crx'" }
            if ($item.version -ne $version) { throw "$key version is '$($item.version)', expected '$version'" }
          }
          $settings = (Get-ItemProperty "HKLM:\SOFTWARE\Policies\Google\Chrome").ExtensionSettings | ConvertFrom-Json
          if ($settings.$id.toolbar_pin -ne 'force_pinned') { throw "ExtensionSettings policy is missing or wrong for $id" }
          "Registry entries for $id v$version look right."

      - name: Uninstall
        shell: powershell
        run: ./scripts/uninstall-gh-slash-extension.ps1 -NoPause

      - name: Check the registry entries are gone
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $id = [regex]::Match((Get-Content scripts/lib-gh-slash-extension.ps1 -Raw), '\$ExtensionID = "(\w+)"').Groups[1].Value
          foreach ($key in "HKLM:\SOFTWARE\Google\Chrome\Extensions\$id", "HKLM:\SOFTWARE\WOW6432Node\Google\Chrome\Extensions\$id") {
            if (Test-Path $key) { throw "$key was not removed" }
          }
          if ($null -ne (Get-ItemProperty "HKLM:\SOFTWARE\Policies\Google\Chrome" -ErrorAction SilentlyContinue).ExtensionSettings) {
            throw "ExtensionSettings policy was not removed"
          }
          "Registry entries removed."

  install-uninstall-unix:
    name: Install and uninstall (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Lint the scripts
        if: runner.os == 'Linux'
        run: shellcheck -x -S warning scripts/*.sh

      - name: Use the packed .crx fixture
        run: cp tests/fixtures/gh-slash-autocomplete-*.crx .

      - name: Pretend Chromium has been used too (Linux)
        if: runner.os == 'Linux'
        run: mkdir -p "$HOME/.config/chromium"

      - name: Install
        run: ./scripts/install-gh-slash-extension.sh --no-pause

      - name: Check the registration
        run: |
          set -e
          id=$(sed -n 's/^EXTENSION_ID="\(.*\)"/\1/p' scripts/lib-gh-slash-extension.sh)
          crx=$(ls "$PWD"/gh-slash-autocomplete-*.crx | head -n 1)
          version=$(basename "$crx" .crx); version=${version#gh-slash-autocomplete-}
          if [ "$RUNNER_OS" = macOS ]; then
            dirs=("$HOME/Library/Application Support/Google/Chrome")
          else
            dirs=("$HOME/.config/google-chrome" "$HOME/.config/chromium")
            grep -q force_pinned /etc/opt/chrome/policies/managed/gh-slash-autocomplete.json
            grep -q force_pinned /etc/chromium/policies/managed/gh-slash-autocomplete.json
          fi
          for dir in "${dirs[@]}"; do
            json="$dir/External Extensions/$id.json"
            cat "$json"
            grep -q "\"external_crx\": \"$crx\"" "$json"
            grep -q "\"external_version\": \"$version\"" "$json"
          done

      - name: Uninstall
        run: ./scripts/uninstall-gh-slash-extension.sh --no-pause

      - name: Check the registration is gone
        run: |
          set -e
          id=$(sed -n 's/^EXTENSION_ID="\(.*\)"/\1/p' scripts/lib-gh-slash-extension.sh)
          if [ "$RUNNER_OS" = macOS ]; then
            test ! -e "$HOME/Library/Application Support/Google/Chrome/External Extensions/$id.json"
          else
            test ! -e "$HOME/.config/google-chrome/External Extensions/$id.json"
            test ! -e "$HOME/.config/chromium/External Extensions/$id.json"
            test ! -e /etc/opt/chrome/policies/managed/gh-slash-autocomplete.json
            test ! -e /etc/chromium/policies/managed/gh-slash-autocomplete.json
          fi

  pack:
    name: Pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pack a .crx with a throwaway key
        shell: bash
        run: |
          # The real signing key is private; a throwaway one is enough to check that packing works.
          openssl genrsa 2048 | openssl pkcs8 -topk8 -nocrypt -out "$RUNNER_TEMP/test.pem"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/pack-extension.ps1 -NoPause -PemKey "$(cygpath -w "$RUNNER_TEMP/test.pem")"
          ls gh-slash-autocomplete-*.crx
  zip:
    name: Web Store zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the zip
        shell: pwsh
        run: ./scripts/zip-extension.ps1

      - name: Check the zip
        shell: pwsh
        run: |
          $version = (Get-Content src/manifest.json -Raw | ConvertFrom-Json).version
          $zip = "dist/gh-slash-autocomplete-$version.zip"
          if (-not (Test-Path $zip)) { throw "$zip was not created" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          if ($names -notcontains 'manifest.json') { throw "manifest.json is not at the root of $zip" }
          "$zip contains $($names.Count) files."

      - name: Build the installer zip
        shell: pwsh
        run: |
          # The fixture is packed from an older version; copy it under the current version's name.
          $version = (Get-Content src/manifest.json -Raw | ConvertFrom-Json).version
          Copy-Item (Get-ChildItem tests/fixtures/gh-slash-autocomplete-*.crx | Select-Object -First 1) "gh-slash-autocomplete-$version.crx"
          ./scripts/zip-installer.ps1
          $zip = "dist/gh-slash-autocomplete-install-$version.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          foreach ($expected in "gh-slash-autocomplete-$version.crx", 'install-gh-slash-extension.sh', 'uninstall-gh-slash-extension.sh', 'lib-gh-slash-extension.sh', 'install-gh-slash-extension.bat', 'scripts/install-gh-slash-extension.ps1', 'uninstall-gh-slash-extension.bat', 'scripts/uninstall-gh-slash-extension.ps1', 'scripts/lib-gh-slash-extension.ps1') {
            if ($names -notcontains $expected) { throw "$expected is missing from $zip" }
          }
          "$zip contains $($names.Count) files."
